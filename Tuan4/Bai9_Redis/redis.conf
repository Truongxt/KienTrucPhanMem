# Redis configuration

# Accept connections on all available network interfaces
bind 0.0.0.0

# Set the port on which the server will listen
port 6379

# Set the number of databases
databases 16

# Specify the format of the log file
loglevel notice

# Set the persistence policy
save 900 1
save 300 10
save 60 10000

# Set the filename for the DB
dbfilename dump.rdb

# Set the working directory
dir /data

# Set maxmemory policy
maxmemory-policy allkeys-lru

# Set the slowlog log microseconds threshold
slowlog-max-len 128

# Enable appendonly mode for better reliability
appendonly yes
appendfilename "appendonly.aof"

# Set the fsync policy for AOF
appendfsync everysec

# Set timeout for idle clients
timeout 0

# Set TCP keepalive
tcp-keepalive 300

# Disable protected mode for Docker
protected-mode no
